<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page introuvable · Thomas Jourda</title>
<meta name="robots" content="noindex">
<!-- Chemins absolus : GitHub Pages sert cette page quelle que soit la profondeur de l'adresse demandée.
     Si un domaine perso est branché, remplacer /Portfolio/ par /. -->
<link rel="preload" href="/Portfolio/assets/fonts/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1618" media="(prefers-color-scheme: dark)">
<!-- Thème choisi appliqué avant le premier affichage (évite un flash de l'autre thème) -->
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/Portfolio/assets/style.css?v=20261125b">
<link rel="icon" href="/Portfolio/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
<main class="wrap notfound">
  <aside class="asset-tag" aria-label="Erreur" data-en-label="Error">
    <p class="tag-head"><span data-en="ERROR">ERREUR</span><span>HTTP 404</span></p>
    <dl>
      <div><dt data-en="Status">Statut</dt><dd><span class="state warn"></span><span data-en="Page not found">Page introuvable</span></dd></div>
      <div><dt data-en="Cause">Cause</dt><dd data-en="Outdated link or mistyped address">Lien obsolète ou adresse mal saisie</dd></div>
    </dl>
    <div class="barcode" aria-hidden="true"></div>
  </aside>
  <h1 data-en="Port closed">Port fermé</h1>
  <p class="lead" data-en="This page does not exist or has moved. The rest of the portfolio is up and running.">Cette page n'existe pas ou a été déplacée. Le reste du portfolio, lui, répond bien.</p>
  <div class="cta">
    <a class="btn primary" href="/Portfolio/" data-en="Back to home" data-en-href="/Portfolio/en/">Retour à l'accueil</a>
    <a class="btn" href="/Portfolio/#projets" data-en="See the projects" data-en-href="/Portfolio/en/#projects">Voir les projets</a>
    <a class="btn" href="/Portfolio/en/" lang="en" data-en="Version française" data-en-href="/Portfolio/" data-en-lang="fr">English version</a>
  </div>
  <p class="note" lang="en" data-en-hide>Page not found: this address does not exist or has moved.</p>
</main>
<script>
// Adresse demandée sous /en/ : la page s'affiche en anglais
if (/^\/Portfolio\/en(\/|$)/.test(location.pathname)) {
  document.documentElement.lang = "en";
  document.title = "Page not found · Thomas Jourda";
  document.querySelectorAll("[data-en]").forEach(function (el) { el.textContent = el.dataset.en; });
  document.querySelectorAll("[data-en-href]").forEach(function (el) { el.href = el.dataset.enHref; });
  document.querySelectorAll("[data-en-lang]").forEach(function (el) { el.lang = el.dataset.enLang; });
  document.querySelectorAll("[data-en-label]").forEach(function (el) { el.setAttribute("aria-label", el.dataset.enLabel); });
  document.querySelectorAll("[data-en-hide]").forEach(function (el) { el.hidden = true; });
}
</script>
</body>
</html>
